{
  "platform": "windows",
  "queries": {
    "defender_mpengine_health": {
      "query": "SELECT protection, key_source, derived_low_confidence, quick_check, integrity_check, wal_header_valid, wal_commits, wal_frames_committed, wal_note, table_count, error FROM defender_mpengine_status;",
      "interval": 3600,
      "description": "Extension health: decryption, key source (known vs derived), SQLite integrity_check and WAL replay. A non-empty error or quick_check/integrity_check != 'ok' means the other queries in this pack return nothing useful.",
      "removed": false
    },
    "defender_mpengine_process_techniques": {
      "query": "SELECT queue_type, technique_id, pid, process_start, entry_key, entry_value, insert_time, expire_time FROM defender_mpengine_rolling_queues WHERE queue_type IN ('techniques', 'inherited_techniques');",
      "interval": 1800,
      "description": "Per-process attack-scoring MITRE ATT&CK techniques (own and inherited). Entries live about one hour, so this runs every 30 minutes to avoid gaps.",
      "removed": false
    },
    "defender_mpengine_recent_threats": {
      "query": "SELECT entry_key, entry_value, pid, process_start, insert_time, expire_time FROM defender_mpengine_rolling_queues WHERE queue_type = 'recent_threats';",
      "interval": 3600,
      "description": "Behaviour-monitoring detections recorded on the machine (RecentThreatsOnMachine queue).",
      "removed": false
    },
    "defender_mpengine_dropped_executables": {
      "query": "SELECT queue, entry_key, entry_value, pid, process_start, insert_time, expire_time FROM defender_mpengine_rolling_queues WHERE queue_type = 'dropped_executable';",
      "interval": 3600,
      "description": "Executables flagged by Defender as recently dropped and then executed (RQ_RecentExecDropped* queues).",
      "removed": false
    },
    "defender_mpengine_suspicious_path_tags": {
      "query": "SELECT file_path, context, insert_time, expire_time FROM defender_mpengine_persist_context WHERE record_kind = 'path_tag' AND context IN ('BM_IsPotentialSideLoad', 'NewPECreatedNoCert', 'ExecutedPENoCert', 'NewlyCreatedZip');",
      "interval": 3600,
      "description": "Files Defender tagged as potential DLL side-loading, newly created or executed unsigned PEs, and newly created ZIP archives.",
      "removed": false
    },
    "defender_mpengine_tamper_protection": {
      "query": "SELECT file_path, context, insert_time, expire_time FROM defender_mpengine_persist_context WHERE file_path = 'MpTamperProtectionState' OR context LIKE '%TamperProtection%';",
      "interval": 3600,
      "description": "Tamper protection state persisted by the engine; a change may indicate an attempt to weaken Defender.",
      "removed": true
    },
    "defender_mpengine_asr_rule_state": {
      "query": "SELECT asr_rule_id, asr_rule_name, context, insert_time, expire_time FROM defender_mpengine_persist_context WHERE record_kind = 'asr_rule_state';",
      "interval": 3600,
      "description": "Attack surface reduction rule state changes recorded by the engine.",
      "removed": true
    },
    "defender_mpengine_asr_blocks": {
      "query": "SELECT time, process_path, target_path, rule_id, asr_rule_name, is_audit, action, process_taint_reason, process_integrity FROM defender_mpengine_process_block_history;",
      "interval": 3600,
      "description": "Processes blocked (or audited) by ASR rules, with the target and the rule name.",
      "removed": false
    },
    "defender_mpengine_ransomware_detections": {
      "query": "SELECT detection_guid, detection_time, last_known_good_time, provisional_remediation_time, remediation_complete_time, impacted_cbp_namespaces FROM defender_mpengine_ransomware_detections;",
      "interval": 3600,
      "description": "Ransomware detections and their remediation / rollback timeline.",
      "removed": false
    },
    "defender_mpengine_ransomware_rollback_tracking": {
      "query": "SELECT file_path, instance_time, first_start_time, first_start_is_time, automatic_removal_policy, impacted_cbp_namespaces FROM defender_mpengine_backup_process_info;",
      "interval": 3600,
      "description": "Files and processes Defender is tracking (backing up) for possible ransomware rollback.",
      "removed": false
    },
    "defender_mpengine_file_hashes": {
      "query": "SELECT instance_time, volume_serial, mft_entry, mft_sequence, md5, sha1, sha256 FROM defender_mpengine_file_hashes;",
      "interval": 86400,
      "description": "Real-time protection file hash cache (file reference + MD5/SHA-1/SHA-256). Can be large, so daily; join mft_entry/volume_serial to NTFS data to resolve paths.",
      "removed": false
    },
    "defender_mpengine_vulnerable_software": {
      "query": "SELECT identifier, kind_name, vulnerabilities, first_seen, last_seen, source FROM defender_mpengine_inventory_identifiers WHERE vulnerabilities != '';",
      "interval": 86400,
      "description": "Software inventory identifiers (CPE / purl) that Defender associates with known vulnerabilities. Changes slowly, so daily.",
      "removed": false
    }
  }
}
