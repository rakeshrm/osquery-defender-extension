name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the binaries for all
# platforms, SHA256SUMS and the osquery pack, with a signed SLSA build
# provenance attestation for every file (verify: gh attestation verify <file>
# -R rakeshrm/osquery-defender-extension).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release
  id-token: write # sign the provenance (Sigstore OIDC)
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: defender/go.mod
          cache-dependency-path: defender/go.sum

      - name: Test
        working-directory: defender
        run: go vet ./... && go test -race ./...

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Verify version stamp
        run: |
          got="$(./bin/defender-mpengine-linux-amd64.ext --version)"
          echo "binary reports: $got"
          [ "$got" = "${GITHUB_REF_NAME#v}" ] || { echo "version mismatch"; exit 1; }

      - name: Stage release files
        run: |
          cp pack/defender_mpengine.conf bin/
          (cd bin && sha256sum defender_mpengine.conf >> SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "bin/*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" bin/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
